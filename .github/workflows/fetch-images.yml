name: Fetch product images
on:
  push:
    branches: [main]
    paths: [catalog.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-images
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/fetch_images.py
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "No new images"; exit 0; fi
          git commit -m "Add product images for new finds"
          git pull --rebase origin main
          git push
